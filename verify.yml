- name: Verify WP + MariaDB primary-replica cluster
  hosts: carrier
  gather_facts: true

  tasks:
    - name: WP container info
      community.docker.docker_container_info:
        name: "{{ wp_container_name }}"
      register: wp_info

    - name: Extract WORDPRESS_DB_HOST
      ansible.builtin.set_fact:
        wp_db_host_env: >-
          {{
            (wp_info.container.Config.Env
              | select('match', '^WORDPRESS_DB_HOST=')
              | list
              | first
              | default('WORDPRESS_DB_HOST='))
            .split('=', 1)[1]
          }}

    - name: Assert WP points to PRIMARY
      ansible.builtin.assert:
        that:
          - "'{{ db_primary_container }}' in wp_db_host_env"
        fail_msg: "WP указывает не на мастер. WORDPRESS_DB_HOST={{ wp_db_host_env }}"
        success_msg: "WP указывает на мастер, WORDPRESS_DB_HOST={{ wp_db_host_env }}"

    - name: PRIMARY container healthy
      community.docker.docker_container_info:
        name: "{{ db_primary_container }}"
      register: c_primary

    - name: Assert PRIMARY healthy
      ansible.builtin.assert:
        that:
          - c_primary.container.State.Running | default(false)
          - c_primary.container.State.Health.Status | default('') == 'healthy'

    - name: REPLICA container healthy
      community.docker.docker_container_info:
        name: "{{ db_replica_container }}"
      register: c_replica

    - name: Assert REPLICA healthy
      ansible.builtin.assert:
        that:
          - c_replica.container.State.Running | default(false)
          - c_replica.container.State.Health.Status | default('') == 'healthy'

    - name: MASTER STATUS present
      community.mysql.mysql_query:
        query: "SHOW MASTER STATUS"
        login_host: "{{ mysql_login_host_primary }}"
        login_port: "{{ mysql_login_port_primary }}"
        login_user: "{{ mysql_login_user }}"
        login_password: "{{ db_root_password }}"
      register: master_status

    - name: Assert MASTER STATUS shape
      ansible.builtin.assert:
        that:
          - master_status.query_result | length > 0
          - master_status.query_result[0] | length > 0
          - master_status.query_result[0][0].File is defined
          - (master_status.query_result[0][0].Position | default(0)) | int > 0

    - name: Set smoke token
      ansible.builtin.set_fact:
        smoke_value: "{{ ansible_date_time.epoch }}"

    - name: Write smoke on PRIMARY
      community.mysql.mysql_query:
        login_host: "{{ mysql_login_host_primary }}"
        login_port: "{{ mysql_login_port_primary }}"
        login_user: "{{ mysql_login_user }}"
        login_password: "{{ db_root_password }}"
        query:
          - "CREATE DATABASE IF NOT EXISTS {{ wordpress_db_name }}"
          - "CREATE TABLE IF NOT EXISTS {{ wordpress_db_name }}.replica_smoke (k VARCHAR(16) PRIMARY KEY, v VARCHAR(64) NOT NULL)"
          - "REPLACE INTO {{ wordpress_db_name }}.replica_smoke (k, v) VALUES ('smoke', '{{ smoke_value }}')"

    - name: Wait replica catches up
      community.mysql.mysql_replication:
        mode: getreplica
        login_host: "{{ mysql_login_host_replica }}"
        login_port: "{{ mysql_login_port_replica }}"
        login_user: "{{ mysql_login_user }}"
        login_password: "{{ db_root_password }}"
      register: repl_status
      until:
        - (repl_status.get('Replica_IO_Running', repl_status.get('Slave_IO_Running', 'no')) | string | lower) == 'yes'
        - (repl_status.get('Replica_SQL_Running', repl_status.get('Slave_SQL_Running', 'no')) | string | lower) == 'yes'
        - (repl_status.get('Seconds_Behind_Source', repl_status.get('Seconds_Behind_Master', 0)) | int) <= 5
      retries: 20
      delay: 3

    - name: Read smoke on REPLICA
      community.mysql.mysql_query:
        login_host: "{{ mysql_login_host_replica }}"
        login_port: "{{ mysql_login_port_replica }}"
        login_user: "{{ mysql_login_user }}"
        login_password: "{{ db_root_password }}"
        query: "SELECT v FROM {{ wordpress_db_name }}.replica_smoke WHERE k='smoke'"
      register: smoke_select
      until:
        - smoke_select.query_result | length > 0
        - smoke_select.query_result[0] | length > 0
      retries: 20
      delay: 3

    - name: Assert smoke replicated
      ansible.builtin.assert:
        that:
          - (smoke_select.query_result[0][0].v | string) == (smoke_value | string)

    - name: HTTP check WordPress
      ansible.builtin.uri:
        url: "http://{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ wordpress_port }}/wp-admin/install.php"
        status_code: 200,301,302
        return_content: false
      register: wp_http
      until: wp_http.status in [200, 301, 302]
      retries: 10
      delay: 3
