- name: Migrate legacy single DB into PRIMARY once
  hosts: carrier
  become: true
  gather_facts: false

  tasks:
    - name: Inspect legacy single DB container
      community.docker.docker_container_info:
        name: wp-db
      register: db_cluster_single_info
      failed_when: false
      changed_when: false

    - name: Derive legacy container IP
      ansible.builtin.set_fact:
        db_cluster_single_ip: >-
          {{
            (db_cluster_single_info.container.NetworkSettings.Networks
             | dict2items | first).value.IPAddress | default('')
          }}
      when: db_cluster_single_info.exists | default(false)

    - name: Ensure dump dir exists
      ansible.builtin.file:
        path: "{{ (db_migration_dump_path | default('/var/tmp/wpdb_dump.sql')) | dirname }}"
        state: directory
        mode: '0755'

    # ВАЖНО: сначала when, потом block (требование линтера)
    - name: Migrate data from legacy single DB if needed
      when:
        - db_cluster_single_info.exists | default(false)
      block:
        - name: Dump legacy DB via module
          community.mysql.mysql_db:
            state: dump
            name: "{{ wordpress_db_name }}"
            target: "{{ db_migration_dump_path | default('/var/tmp/wpdb_dump.sql') }}"
            login_host: "{{ db_cluster_single_ip }}"
            login_port: 3306
            login_user: root
            login_password: "{{ db_root_password }}"

        - name: Import dump to PRIMARY
          community.mysql.mysql_db:
            state: import
            name: "{{ wordpress_db_name }}"
            target: "{{ db_migration_dump_path | default('/var/tmp/wpdb_dump.sql') }}"
            login_host: "{{ db_cluster_mysql_login_host_primary }}"
            login_port: "{{ db_cluster_mysql_login_port_primary }}"
            login_user: root
            login_password: "{{ db_root_password }}"

        - name: Remove dump
          ansible.builtin.file:
            path: "{{ db_migration_dump_path | default('/var/tmp/wpdb_dump.sql') }}"
            state: absent

        - name: Stop and remove legacy single DB
          community.docker.docker_container:
            name: wp-db
            state: absent
            force_kill: true

    - name: Ensure WordPress DB exists on REPLICA
      community.mysql.mysql_db:
        name: "{{ wordpress_db_name }}"
        state: present
        login_host: "{{ db_cluster_mysql_login_host_replica }}"
        login_port: "{{ db_cluster_mysql_login_port_replica }}"
        login_user: "{{ db_cluster_mysql_login_user }}"
        login_password: "{{ db_root_password }}"

    - name: Check wp_options presence on PRIMARY
      community.mysql.mysql_query:
        login_host: "{{ db_cluster_mysql_login_host_primary }}"
        login_port: "{{ db_cluster_mysql_login_port_primary }}"
        login_user: root
        login_password: "{{ db_root_password }}"
        query: "SELECT COUNT(*) AS c FROM information_schema.tables WHERE table_schema='{{ wordpress_db_name }}' AND table_name='wp_options'"
      register: db_cluster_wpopt_check

    - name: Report state result
      ansible.builtin.debug:
        msg: >-
          {{
            'OK: wp_options есть — стейт перенесён/присутствовал'
            if (db_cluster_wpopt_check.query_result[0][0].c | int) > 0
            else
            'WARN: wp_options нет — WP потребует первичную установку'
          }}
