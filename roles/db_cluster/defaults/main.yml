# === Login from controller to PRIMARY / REPLICA ===
db_cluster_mysql_login_user: root
db_cluster_mysql_login_host_primary: 127.0.0.1
db_cluster_mysql_login_port_primary: 3306
db_cluster_mysql_login_host_replica: 127.0.0.1
db_cluster_mysql_login_port_replica: 3307

# === Replication creds ===
db_cluster_repl_user: repl
db_cluster_repl_password: "{{ vault_db_cluster_repl_password | default('change_me_repl') }}"

# === MariaDB args ===
db_cluster_mariadb_primary_extra_args:
  - --server-id=1
  - --log-bin=mysql-bin
  - --binlog_format=ROW
  - --log-basename=primary
  - --innodb_flush_log_at_trx_commit=1

db_cluster_mariadb_replica_extra_args:
  - --server-id=2
  - --relay-log=relay-bin
  - --log-basename=replica
