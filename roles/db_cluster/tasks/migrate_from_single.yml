- name: Inspect legacy single DB container
  community.docker.docker_container_info:
    name: wp-db
  register: db_cluster_single_info
  failed_when: false
  changed_when: false

- name: Check if primary DB already initialized
  community.mysql.mysql_query:
    login_host: "{{ db_cluster_mysql_login_host_primary }}"
    login_port: "{{ db_cluster_mysql_login_port_primary }}"
    login_user: root
    login_password: "{{ db_root_password }}"
    query: "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ wordpress_db_name }}' AND table_name='wp_options';"
  register: db_cluster_primary_wp_options
  changed_when: false

- name: Derive legacy container IP
  ansible.builtin.set_fact:
    db_cluster_single_ip: "{{ (db_cluster_single_info.container.NetworkSettings.Networks | dict2items | first).value.IPAddress | default('') }}"
  when: db_cluster_single_info.exists | default(false)

- name: Migrate data from legacy single DB if needed
  when:
    - (db_cluster_single_info.exists | default(false))
    - (db_cluster_primary_wp_options.results[0].rows[0][0] | int) == 0
  block:
    - name: Dump legacy DB via module
      community.mysql.mysql_db:
        state: dump
        name: "{{ wordpress_db_name }}"
        target: /tmp/wpdb_dump.sql
        login_host: "{{ db_cluster_single_ip }}"
        login_port: 3306
        login_user: root
        login_password: "{{ db_root_password }}"

    - name: Import dump to PRIMARY
      community.mysql.mysql_db:
        state: import
        name: "{{ wordpress_db_name }}"
        target: /tmp/wpdb_dump.sql
        login_host: "{{ db_cluster_mysql_login_host_primary }}"
        login_port: "{{ db_cluster_mysql_login_port_primary }}"
        login_user: root
        login_password: "{{ db_root_password }}"

    - name: Remove dump
      ansible.builtin.file:
        path: /tmp/wpdb_dump.sql
        state: absent

    - name: Stop and remove legacy single DB
      community.docker.docker_container:
        name: wp-db
        state: absent
        force_kill: true
