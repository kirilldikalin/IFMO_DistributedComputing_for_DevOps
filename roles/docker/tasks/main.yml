- name: Remove any Docker apt list files in sources.list.d
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: 'docker*.list*'
    file_type: file
  register: docker_lists
  failed_when: false
  tags: ['docker']

- name: Remove found Docker apt list files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_lists.files | default([]) }}"
  when: docker_lists.files is defined
  tags: ['docker']

- name: Remove any Docker lines from /etc/apt/sources.list
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: '^\s*deb\s+.*download\.docker\.com.*$'
    replace: ''
  tags: ['docker']

- name: Ensure prerequisites packages are present (no cache refresh)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: false
  tags: ['docker']

- name: Install Docker apt key (module, no command)
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: ['docker']

- name: Add Docker apt repository (no signed-by)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  tags: ['docker']

- name: Refresh APT cache
  ansible.builtin.apt:
    update_cache: true
  tags: ['docker']

- name: Install Docker CE
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: ['docker']

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: ['docker']
