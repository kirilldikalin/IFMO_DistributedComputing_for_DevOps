---
- name: Обновить кэш APT
  ansible.builtin.apt:
    update_cache: yes
  become: true

- name: Обновить пакеты до последних версий
  ansible.builtin.apt:
    upgrade: yes
    update_cache: yes
  become: true

- name: Установить пакеты для Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
      - python3-venv
      - python3-docker
      - python3-pymysql
    state: present
    update_cache: yes
  become: true

- name: Добавить GPG-ключ Docker
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: true

- name: Добавить репозиторий Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: true

- name: Установить Docker Engine и Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: true

- name: Включить и запустить Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true
