---
- name: Создать проектную директорию
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: '0755'
  become: true

- name: Остановить предыдущий стек (если есть)
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    state: absent
    remove_volumes: true
  become: true
  failed_when: false
  when: stack_reset | bool

- name: Скопировать docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: '0644'
  become: true

- name: Подготовить директорию для переменных
  ansible.builtin.file:
    path: "{{ project_dir }}/group_vars"
    state: directory
    mode: '0755'
  become: true

- name: Скопировать переменные проекта для отладки
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../group_vars/all.yml"
    dest: "{{ project_dir }}/group_vars/all.yml"
    mode: '0644'
  become: true
  ignore_errors: false

- name: Pull образов
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    pull: always
  become: true
  when: stack_pull | bool

- name: Поднять сервисы
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    state: present
    services: "{{ stack_start_services }}"
  become: true
  when: (stack_start_services | length) > 0
