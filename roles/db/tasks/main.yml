- name: Ensure secrets dir for single DB
  ansible.builtin.file:
    path: /opt/wpdb/secrets
    state: directory
    mode: '0700'

- name: Write mysql_root.cnf secret
  ansible.builtin.copy:
    dest: /opt/wpdb/secrets/mysql_root.cnf
    mode: '0600'
    content: |
      [client]
      user=root
      password={{ db_root_password }}

- name: Ensure single DB volume
  community.docker.docker_volume:
    name: "{{ db_volume }}"
    state: present

- name: Run single MariaDB container
  community.docker.docker_container:
    name: "{{ db_container_name }}"
    image: "{{ db_image }}"
    state: started
    restart_policy: always
    networks:
      - name: "{{ docker_network_name }}"
    volumes:
      - "{{ db_volume }}:/var/lib/mysql"
      - "/opt/wpdb/secrets/mysql_root.cnf:/run/secrets/mysql_root.cnf:ro"
    env:
      MARIADB_ROOT_PASSWORD: "{{ db_root_password }}"
      MARIADB_DATABASE: "{{ wordpress_db_name }}"
      MARIADB_USER: "{{ wordpress_db_user }}"
      MARIADB_PASSWORD: "{{ wordpress_db_password }}"
      MARIADB_CHARSET: "{{ db_charset | default('utf8mb4') }}"
      MARIADB_COLLATE: "{{ db_collation | default('utf8mb4_unicode_ci') }}"

- name: Wait single DB ready
  community.docker.docker_container_exec:
    container: "{{ db_container_name }}"
    command: sh -lc "mysqladmin --defaults-extra-file=/run/secrets/mysql_root.cnf ping -h 127.0.0.1"
  register: db_single_ping
  retries: 30
  delay: 2
  until: db_single_ping.rc == 0
  changed_when: false
